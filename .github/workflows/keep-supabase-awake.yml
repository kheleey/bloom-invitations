# Free Supabase projects pause after a week with no activity.
# This visits the guestbook every three days so it stays awake. It reads the
# address and public key from index.html, so there is nothing else to set up.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *"   # every three days
  workflow_dispatch:          # or run it by hand from the Actions tab

permissions:
  contents: read            # it only reads index.html

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Visit the guestbook
        run: |
          URL=$(grep -o "supabaseUrl: *'[^']*'" index.html | sed "s/.*'\(.*\)'/\1/")
          KEY=$(grep -o "supabaseKey: *'[^']*'" index.html | sed "s/.*'\(.*\)'/\1/")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "No Supabase settings in index.html yet, so there is nothing to keep awake."
            exit 0
          fi
          curl -fsS "$URL/rest/v1/bloom_events?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Supabase is awake."
